<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#e8eef6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2e3038" media="(prefers-color-scheme: dark)" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <title>新标签页</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.35);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
      --glass-inset: inset 0 1px 0 0 rgba(255, 255, 255, 0.5), inset 0 -1px 0 0 rgba(255, 255, 255, 0.15);
      --radius: 1.25rem;
      --radius-sm: 0.75rem;
      --text: rgba(30, 30, 35, 0.95);
      --text-muted: rgba(60, 60, 70, 0.75);
      --bg-gradient: linear-gradient(165deg, #e8eef6 0%, #dde5f0 35%, #f0f4fb 70%, #e2eaf5 100%);
      --tt-text-light: rgba(30, 30, 35, 0.95);
      --tt-text-dark: rgba(255, 255, 255, 0.92);
      --tt-muted-light: rgba(60, 60, 70, 0.75);
      --tt-muted-dark: rgba(255, 255, 255, 0.65);
      --tt-glass-bg-light: rgba(255, 255, 255, 0.12);
      --tt-glass-bg-dark: rgba(60, 62, 72, 0.35);
      --tt-glass-border-light: rgba(255, 255, 255, 0.35);
      --tt-glass-border-dark: rgba(255, 255, 255, 0.18);
      --tt-search-bg-light: rgba(255, 255, 255, 0.4);
      --tt-search-bg-dark: rgba(255, 255, 255, 0.12);
      --tt-search-border-light: rgba(255, 255, 255, 0.6);
      --tt-search-border-dark: rgba(255, 255, 255, 0.2);
      --tt-search-hover-light: rgba(255, 255, 255, 0.55);
      --tt-search-hover-dark: rgba(255, 255, 255, 0.2);
      --tt-link-bg-light: rgba(255, 255, 255, 0.2);
      --tt-link-bg-dark: rgba(255, 255, 255, 0.1);
      --tt-link-border-light: rgba(255, 255, 255, 0.35);
      --tt-link-border-dark: rgba(255, 255, 255, 0.2);
      --tt-link-hover-light: rgba(255, 255, 255, 0.35);
      --tt-link-hover-dark: rgba(255, 255, 255, 0.18);
      --tt-topbar-bg-light: rgba(255, 255, 255, 0.2);
      --tt-topbar-bg-dark: rgba(255, 255, 255, 0.08);
      --tt-topbar-hover-light: rgba(255, 255, 255, 0.35);
      --tt-topbar-hover-dark: rgba(255, 255, 255, 0.15);
      --tt-glass-after-light: 0.6;
      --tt-glass-after-dark: 0.25;
      --tt-glass-shadow-light: rgba(0, 0, 0, 0.06);
      --tt-glass-shadow-dark: rgba(0, 0, 0, 0.2);
      --tt-footer-muted-light: rgba(30, 30, 38, 0.22);
      --tt-footer-muted-dark: rgba(255, 255, 255, 0.22);
    }
    body.night-mode {
      --glass-bg: rgba(60, 62, 72, 0.35);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      --glass-inset: inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
      --text: rgba(255, 255, 255, 0.92);
      --text-muted: rgba(255, 255, 255, 0.65);
      --bg-gradient: linear-gradient(165deg, #383a42 0%, #3d3f48 35%, #34363e 70%, #2e3038 100%);
    }

    body.night-mode .glass::after {
      opacity: 0.25;
    }

    body.night-mode .search-engine-toggle,
    body.night-mode .search-btn {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    body.night-mode .search-engine-toggle:hover,
    body.night-mode .search-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    body.night-mode .link-card {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    body.night-mode .link-card:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    body.theme-transitioning {
      --text: color-mix(in srgb, var(--tt-text-light) calc((1 - var(--theme-t)) * 100%), var(--tt-text-dark) calc(var(--theme-t) * 100%));
      --text-muted: color-mix(in srgb, var(--tt-muted-light) calc((1 - var(--theme-t)) * 100%), var(--tt-muted-dark) calc(var(--theme-t) * 100%));
      --glass-bg: color-mix(in srgb, var(--tt-glass-bg-light) calc((1 - var(--theme-t)) * 100%), var(--tt-glass-bg-dark) calc(var(--theme-t) * 100%));
      --glass-border: color-mix(in srgb, var(--tt-glass-border-light) calc((1 - var(--theme-t)) * 100%), var(--tt-glass-border-dark) calc(var(--theme-t) * 100%));
      --glass-shadow: 0 8px 32px color-mix(in srgb, var(--tt-glass-shadow-light) calc((1 - var(--theme-t)) * 100%), var(--tt-glass-shadow-dark) calc(var(--theme-t) * 100%));
      --glass-inset: inset 0 1px 0 0 color-mix(in srgb, rgba(255, 255, 255, 0.5) calc((1 - var(--theme-t)) * 100%), rgba(255, 255, 255, 0.12) calc(var(--theme-t) * 100%)), inset 0 -1px 0 0 color-mix(in srgb, rgba(255, 255, 255, 0.15) calc((1 - var(--theme-t)) * 100%), rgba(255, 255, 255, 0.12) calc(var(--theme-t) * 100%));
      --bg-gradient: linear-gradient(165deg,
        color-mix(in srgb, #e8eef6 calc((1 - var(--theme-t)) * 100%), #383a42 calc(var(--theme-t) * 100%)) 0%,
        color-mix(in srgb, #dde5f0 calc((1 - var(--theme-t)) * 100%), #3d3f48 calc(var(--theme-t) * 100%)) 35%,
        color-mix(in srgb, #f0f4fb calc((1 - var(--theme-t)) * 100%), #34363e calc(var(--theme-t) * 100%)) 70%,
        color-mix(in srgb, #e2eaf5 calc((1 - var(--theme-t)) * 100%), #2e3038 calc(var(--theme-t) * 100%)) 100%);
    }
    body.theme-transitioning .glass::after {
      opacity: calc(0.6 - 0.35 * var(--theme-t));
    }
    body.theme-transitioning .search-engine-toggle,
    body.theme-transitioning .search-btn {
      background: color-mix(in srgb, var(--tt-search-bg-light) calc((1 - var(--theme-t)) * 100%), var(--tt-search-bg-dark) calc(var(--theme-t) * 100%));
      border-color: color-mix(in srgb, var(--tt-search-border-light) calc((1 - var(--theme-t)) * 100%), var(--tt-search-border-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .search-engine-toggle:hover,
    body.theme-transitioning .search-btn:hover {
      background: color-mix(in srgb, var(--tt-search-hover-light) calc((1 - var(--theme-t)) * 100%), var(--tt-search-hover-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .link-card {
      background: color-mix(in srgb, var(--tt-link-bg-light) calc((1 - var(--theme-t)) * 100%), var(--tt-link-bg-dark) calc(var(--theme-t) * 100%));
      border-color: color-mix(in srgb, var(--tt-link-border-light) calc((1 - var(--theme-t)) * 100%), var(--tt-link-border-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .link-card:hover {
      background: color-mix(in srgb, var(--tt-link-hover-light) calc((1 - var(--theme-t)) * 100%), var(--tt-link-hover-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .top-bar-btn {
      background: color-mix(in srgb, var(--tt-topbar-bg-light) calc((1 - var(--theme-t)) * 100%), var(--tt-topbar-bg-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .top-bar-btn:hover {
      background: color-mix(in srgb, var(--tt-topbar-hover-light) calc((1 - var(--theme-t)) * 100%), var(--tt-topbar-hover-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .link-add-btn .link-add-inner {
      background: color-mix(in srgb, var(--tt-link-bg-light) calc((1 - var(--theme-t)) * 100%), var(--tt-link-bg-dark) calc(var(--theme-t) * 100%));
      border-color: color-mix(in srgb, var(--tt-link-border-light) calc((1 - var(--theme-t)) * 100%), var(--tt-link-border-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .link-add-btn .link-add-inner:hover {
      background: color-mix(in srgb, var(--tt-link-hover-light) calc((1 - var(--theme-t)) * 100%), var(--tt-link-hover-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .engine-dropdown {
      background: color-mix(in srgb, rgba(255, 255, 255, 0.14) calc((1 - var(--theme-t)) * 100%), rgba(40, 40, 48, 0.9) calc(var(--theme-t) * 100%));
      border-color: color-mix(in srgb, var(--tt-glass-border-light) calc((1 - var(--theme-t)) * 100%), rgba(255, 255, 255, 0.1) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .engine-option:hover {
      background: color-mix(in srgb, rgba(255, 255, 255, 0.35) calc((1 - var(--theme-t)) * 100%), rgba(255, 255, 255, 0.1) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .engine-option.active {
      background: color-mix(in srgb, rgba(255, 255, 255, 0.4) calc((1 - var(--theme-t)) * 100%), rgba(255, 255, 255, 0.15) calc(var(--theme-t) * 100%));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      min-height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      position: relative;
      background: transparent;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      --page-pad: clamp(0.75rem, 4vw, 2rem);
      padding: var(--page-pad);
      padding-left: max(var(--page-pad), env(safe-area-inset-left, 0px));
      padding-right: max(var(--page-pad), env(safe-area-inset-right, 0px));
      padding-bottom: max(var(--page-pad), env(safe-area-inset-bottom, 0px));
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      z-index: -1;
      inset: 0;
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      background: var(--bg-gradient);
      pointer-events: none;
    }

    @media (pointer: coarse) {
      html,
      body {
        -webkit-user-select: none;
        user-select: none;
        -moz-user-select: none;
        -webkit-touch-callout: none;
      }

      .search-input,
      .modal input {
        -webkit-user-select: text;
        user-select: text;
        -moz-user-select: text;
        -webkit-touch-callout: default;
      }
    }
    .glass {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--glass-shadow), var(--glass-inset);
      overflow: hidden;
    }

    .glass::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(165deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.02) 45%, transparent 65%);
      border-radius: var(--radius);
      pointer-events: none;
      opacity: 0.6;
    }
    .main-center {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-top: calc(52px + env(safe-area-inset-top, 0px));
      padding-bottom: max(0.35rem, env(safe-area-inset-bottom, 0px));
    }

    .main-center-stack {
      width: 100%;
      max-width: min(580px, calc(100vw - 2rem));
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      margin-top: auto;
      margin-bottom: auto;
      padding: 0.25rem 0;
    }

    .search-wrap {
      width: 100%;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .search-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.5rem 0.5rem 1.25rem;
      min-height: 56px;
      overflow: visible;
    }

    .search-engine-toggle {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.4rem 0.5rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }

    .search-engine-toggle .engine-toggle-label {
      display: none;
    }

    .search-engine-toggle:hover {
      background: rgba(255, 255, 255, 0.55);
      color: var(--text);
    }

    .search-engine-toggle svg {
      width: 18px;
      height: 18px;
      opacity: 0.9;
    }

    .search-form {
      flex: 1;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: none;
      background: transparent;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.5);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }

    .search-btn:hover {
      background: rgba(255, 255, 255, 0.7);
      transform: scale(1.02);
    }

    .search-btn svg {
      width: 20px;
      height: 20px;
    }
    .search-engine-wrap {
      overflow: visible;
    }

    .engine-dropdown {
      position: fixed;
      min-width: 180px;
      padding: 0.5rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08), inset 0 1px 0 0 rgba(255, 255, 255, 0.4);
      z-index: 1000;
      display: none;
    }

    body.night-mode .engine-dropdown {
      background: rgba(40, 40, 48, 0.9);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .engine-dropdown.show {
      display: block;
    }

    .engine-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.85rem;
      margin-bottom: 0.25rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text);
      transition: background 0.15s, box-shadow 0.15s;
      position: relative;
      isolation: isolate;
    }

    .engine-option:last-child {
      margin-bottom: 0;
    }

    .engine-option:hover {
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    body.night-mode .engine-option:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .engine-option.active {
      background: rgba(255, 255, 255, 0.4);
      font-weight: 500;
    }

    body.night-mode .engine-option.active {
      background: rgba(255, 255, 255, 0.15);
    }
    .quick-links-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: visible;
      flex-shrink: 0;
    }

    .link-add-btn {
      flex-shrink: 0;
    }

    .link-add-btn .link-add-inner {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .link-add-btn .link-add-inner:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.08);
    }

    @keyframes edit-add-fade-soft {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .quick-links-wrap.edit-mode.link-add-enter .link-item:not(.link-add-btn) {
      animation: none;
    }

    .quick-links-wrap.edit-mode.link-add-enter .link-item.link-add-btn {
      animation: edit-add-fade-soft 0.42s ease-out 0.05s both;
    }

    @media (max-width: 560px) {
      .main-center-stack:has(.quick-links-wrap.link-add-enter) .search-wrap {
        animation: none;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .quick-links-wrap.edit-mode.link-add-enter .link-item.link-add-btn {
        animation: none;
      }
    }

    body.night-mode .link-add-btn .link-add-inner {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .link-add-btn .link-add-inner svg {
      width: 24px;
      height: 24px;
    }

    .links-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      position: relative;
      overflow: visible;
    }

    .quick-links-wrap.links-empty .links-grid {
      min-height: 52px;
    }

    .link-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .link-card {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      flex-shrink: 0;
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    .quick-links-wrap.edit-mode .link-card:hover {
      transform: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .link-card img.link-favicon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: contain;
    }

    .link-card .link-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.4);
    }

    .link-item .btn-delete {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      background: rgba(220, 60, 60, 0.9);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .quick-links-wrap.edit-mode .link-item .btn-delete {
      display: flex;
      opacity: 1;
      transition: opacity 0.22s ease-out;
    }

    .links-grid .link-item:not(.link-add-btn) .link-card {
      touch-action: manipulation;
      cursor: grab;
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
    }
    @media (pointer: fine) {
      .links-grid .link-item:not(.link-add-btn) .link-card {
        touch-action: none;
      }
    }
    @media (pointer: coarse) {
      .links-grid .link-item:not(.link-add-btn) .link-card {
        cursor: pointer;
      }
    }

    .links-grid .link-item:not(.link-add-btn) .link-card img {
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: none;
    }

    .links-grid.link-sort-active {
      cursor: grabbing;
    }

    .link-item--placeholder {
      opacity: 0.38;
      pointer-events: none;
    }

    .link-item--drag-ghost {
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.18));
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    body:not(.night-mode) .modal-overlay {
      background: rgba(72, 86, 108, 0.13);
    }

    .modal-overlay.show {
      display: flex;
    }
    .modal {
      position: relative;
      overflow: hidden;
      min-width: min(320px, calc(100vw - 2rem));
      max-width: min(440px, calc(100vw - 2rem));
      padding: 1.35rem 1.35rem 1.2rem;

  <script>
    const DEFAULT_ENGINES = [
      { id: 'bing', name: 'Bing 必应', url: 'https://www.bing.com/search?q={q}', builtin: true },
      { id: 'google', name: 'Google 谷歌', url: 'https://www.google.com/search?q={q}', builtin: true },
      { id: 'baidu', name: 'Baidu 百度', url: 'https://www.baidu.com/s?wd={q}', builtin: true }
    ];

    const STORAGE_ENGINES = 'navSearchEngines';
    const STORAGE_ENGINE_CURRENT = 'navSearchEngineCurrent';
    const STORAGE_NIGHT = 'navNightMode';
    const STORAGE_FOLLOW_SYSTEM = 'navThemeFollowSystem';

    const UI = {
      searchHint: '请输入搜索内容',
      modalAddLink: '添加快捷链接',
      modalEditLink: '编辑链接',
      engineNamePlaceholder: '如：Bing 必应',
      engineUrlPlaceholder: '如：bing.com 或 https://www.bing.com/',
      engineSetDefault: '设为默认',
      engineDelete: '删除',
      engineDefault: '(默认)',
      engineEdit: '修改'
    };

    function getEngines() {
      try {
        const raw = localStorage.getItem(STORAGE_ENGINES);
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr) && arr.length) return arr;
        }
      } catch (e) {}
      return DEFAULT_ENGINES.map(e => ({ ...e }));
    }

    function saveEngines(engines) {
      localStorage.setItem(STORAGE_ENGINES, JSON.stringify(engines));
    }

    var SEARCH_ENGINE_TEMPLATES = {
      'baidu.com': { name: '百度', searchUrl: 'https://www.baidu.com/s?wd={q}' },
      'www.baidu.com': { name: '百度', searchUrl: 'https://www.baidu.com/s?wd={q}' },
      'google.com': { name: 'Google 谷歌', searchUrl: 'https://www.google.com/search?q={q}' },
      'www.google.com': { name: 'Google 谷歌', searchUrl: 'https://www.google.com/search?q={q}' },
      'google.com.hk': { name: 'Google 谷歌', searchUrl: 'https://www.google.com.hk/search?q={q}' },
      'bing.com': { name: 'Bing 必应', searchUrl: 'https://www.bing.com/search?q={q}' },
      'www.bing.com': { name: 'Bing 必应', searchUrl: 'https://www.bing.com/search?q={q}' },
      'sogou.com': { name: '搜狗搜索', searchUrl: 'https://www.sogou.com/web?query={q}' },
      'www.sogou.com': { name: '搜狗搜索', searchUrl: 'https://www.sogou.com/web?query={q}' },
      'so.com': { name: '360 搜索', searchUrl: 'https://www.so.com/s?q={q}' },
      'www.so.com': { name: '360 搜索', searchUrl: 'https://www.so.com/s?q={q}' },
      'duckduckgo.com': { name: 'DuckDuckGo', searchUrl: 'https://duckduckgo.com/?q={q}' },
      'www.duckduckgo.com': { name: 'DuckDuckGo', searchUrl: 'https://duckduckgo.com/?q={q}' },
      'yahoo.com': { name: 'Yahoo', searchUrl: 'https://search.yahoo.com/search?p={q}' },
      'search.yahoo.com': { name: 'Yahoo', searchUrl: 'https://search.yahoo.com/search?p={q}' },
      'yandex.com': { name: 'Yandex', searchUrl: 'https://yandex.com/search/?text={q}' },
      'yandex.ru': { name: 'Yandex', searchUrl: 'https://yandex.ru/search/?text={q}' },
      'www.yandex.ru': { name: 'Yandex', searchUrl: 'https://yandex.ru/search/?text={q}' },
      'ecosia.org': { name: 'Ecosia', searchUrl: 'https://www.ecosia.org/search?q={q}' },
      'www.ecosia.org': { name: 'Ecosia', searchUrl: 'https://www.ecosia.org/search?q={q}' },
      'metaso.cn': { name: '秘塔 AI', searchUrl: 'https://metaso.cn/search?q={q}' },
      'www.metaso.cn': { name: '秘塔 AI', searchUrl: 'https://metaso.cn/search?q={q}' }
    };

    function normalizeEngineInput(inputUrl, inputName) {
      var raw = (inputUrl || '').trim().toLowerCase();
      if (!raw) return null;
      var domain = '';
      if (/^https?:\/\//i.test(raw)) {
        try {
          var u = new URL(raw);
          domain = u.hostname.replace(/^www\./, '');
        } catch (e) {
          domain = raw.replace(/^https?:\/\//, '').replace(/\/.*$/, '').replace(/^www\./, '');
        }
      } else {
        domain = raw.replace(/\/.*$/, '').replace(/^www\./, '');
      }
      if (!domain) return null;
      var withWww = 'www.' + domain;
      var template = SEARCH_ENGINE_TEMPLATES[domain] || SEARCH_ENGINE_TEMPLATES[withWww];
      if (template) {
        return { name: inputName && inputName.trim() ? inputName.trim() : template.name, searchUrl: template.searchUrl };
      }
      if (raw.includes('{q}')) {
        var u = inputUrl.trim();
        return { name: inputName && inputName.trim() ? inputName.trim() : domain, searchUrl: /^https?:\/\//i.test(u) ? u : 'https://' + u.replace(/^\/+/, '') };
      }
      var host = domain.includes('.') ? domain : 'www.' + domain;
      return { name: inputName && inputName.trim() ? inputName.trim() : domain, searchUrl: 'https://' + host + '/search?q={q}' };
    }

    function getSearchUrl(engine, q) {
      const encoded = encodeURIComponent(q);
      const url = (engine.url || '').trim();
      if (url.includes('baidu.com')) {
        return 'https://www.baidu.com/s?wd=' + encoded;
      }
      return url.replace(/\{q\}/g, encoded);
    }

    function getEngineDomain(url) {
      if (!url || typeof url !== 'string') return '';
      try {
        var u = new URL(url.includes('://') ? url : 'https://' + url);
        return u.hostname.replace(/^www\./, '');
      } catch (e) {
        return '';
      }
    }

    function getEngineFaviconUrl(engine) {
      var domain = getEngineDomain(engine && engine.url);
      if (!domain) return '';
      return 'https://api.xinac.net/icon/?url=https://' + encodeURIComponent(domain);
    }

    const DEFAULT_LINKS = [];

    const STORAGE_KEY = 'navQuickLinks';

    function normalizeLinkUrl(str) {
      var u = (str || '').trim();
      if (!u) return u;
      if (/^https?:\/\//i.test(u)) return u;
      return 'https://' + u.replace(/^\/+/, '');
    }

    function getDomain(url) {
      try {
        var normalized = normalizeLinkUrl(url);
        if (!normalized) return '';
        const u = new URL(normalized);
        return u.hostname.replace(/^www\./, '');
      } catch {
        return '';
      }
    }

    function faviconUrl(url) {
      const domain = getDomain(url);
      return domain ? 'https://api.xinac.net/icon/?url=https://' + domain : '';
    }

    function getLinks() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw != null) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) return arr;
        }
      } catch (e) {}
      return DEFAULT_LINKS.slice();
    }

    function saveLinks(links) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
    }

    const linksGrid = document.getElementById('linksGrid');
    const quickLinksWrap = document.getElementById('quickLinksWrap');
    const settingsDropdown = document.getElementById('settingsDropdown');
    var LINK_SORT_THRESHOLD_SQ = 36;

    function mediaPrimaryPointerFine() {
      try {
        return window.matchMedia('(pointer: fine)').matches;
      } catch (err) {
        return true;
      }
    }

    function isBlankForSettingsMenu(el) {
      if (!el || el.nodeType !== 1) return false;
      if (el.closest('.top-bar')) return false;
      if (el.closest('.search-bar')) return false;
      if (el.closest('.engine-dropdown')) return false;
      if (el.closest('.settings-dropdown')) return false;
      if (el.closest('.modal-overlay')) return false;
      if (el.closest('.link-card')) return false;
      if (el.closest('.link-add-btn')) return false;
      if (el.closest('.btn-delete')) return false;
      if (el.closest('.search-hint-wrap') || el.classList.contains('search-input')) return false;
      if (el.closest('.search-btn')) return false;
      if (el.closest('.undo-toast')) return false;
      return true;
    }

    function showSettingsMenuAt(clientX, clientY) {
      if (!settingsDropdown) return;
      settingsDropdown.classList.add('show');
      settingsDropdown.style.visibility = 'hidden';
      settingsDropdown.style.left = '0px';
      settingsDropdown.style.top = '0px';
      settingsDropdown.style.right = 'auto';
      requestAnimationFrame(function () {
        var w = settingsDropdown.offsetWidth;
        var h = settingsDropdown.offsetHeight;
        var left = clientX;
        var top = clientY;
        if (left + w > window.innerWidth - 8) left = window.innerWidth - w - 8;
        if (top + h > window.innerHeight - 8) top = window.innerHeight - h - 8;
        if (left < 8) left = 8;
        if (top < 8) top = 8;
        settingsDropdown.style.left = left + 'px';
        settingsDropdown.style.top = top + 'px';
        settingsDropdown.style.visibility = '';
        updateFollowSystemMenuCheck();
      });
    }

    document.addEventListener('contextmenu', function (e) {
      var t = e.target;
      if (t && t.closest('.link-card') && !quickLinksWrap.classList.contains('edit-mode')) {
        e.preventDefault();
        e.stopPropagation();
        if (mediaPrimaryPointerFine()) {
          setEditMode(true);
        }
        return;
      }
      if (!isBlankForSettingsMenu(t)) return;
      e.preventDefault();
      showSettingsMenuAt(e.clientX, e.clientY);
    }, true);

    var blankLongTimer = null;
    var blankLongStart = null;
    function clearBlankLongPress() {
      if (blankLongTimer) {
        clearTimeout(blankLongTimer);
        blankLongTimer = null;
      }
      blankLongStart = null;
    }
    document.body.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) return;
      var p = e.touches[0];
      var el = document.elementFromPoint(p.clientX, p.clientY);
      if (!isBlankForSettingsMenu(el)) return;
      blankLongStart = { x: p.clientX, y: p.clientY };
      blankLongTimer = setTimeout(function () {
        blankLongTimer = null;
        showSettingsMenuAt(blankLongStart.x, blankLongStart.y);
        blankLongStart = null;
      }, 550);
    }, { passive: true });
    document.body.addEventListener('touchmove', function (e) {
      if (!blankLongStart || !e.touches.length) return;
      var p = e.touches[0];

    function scheduleFitSingleLineToast(toastEl) {
      if (!toastEl) return;
      function runFit() {
        if (!toastEl.classList.contains('show')) return;
        var msgEl = toastEl.querySelector('.undo-toast-msg');
        if (!msgEl) return;
        var btns = toastEl.querySelectorAll('.undo-toast-btn');
        msgEl.style.removeProperty('font-size');
        btns.forEach(function (b) {

        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            var maxRem = 0.875;
            var minRem = 0.45;
            var step = 0.03125;
            var r;
            for (r = maxRem; r >= minRem - 0.0001; r -= step) {
              msgEl.style.fontSize = r + 'rem';
              var bfs = Math.max(minRem, r * 0.92);
              btns.forEach(function (b) {
                b.style.fontSize = bfs + 'rem';
              });
              if (toastEl.scrollWidth <= toastEl.clientWidth + 2 && toastEl.scrollHeight <= toastEl.clientHeight + 2) {
                return;
              }
            }
          });
        });
      }
      runFit();
      setTimeout(runFit, 40);

    function abortLinkSortDrag() {
      var st = linkSortState;
      if (!st) return;
      if (st.ghost) {
        st.ghost.remove();
        st.ghost = null;
      }
      if (st.item) {
        st.item.classList.remove('link-item--placeholder');

    function linkSortComputeInsert(clientX, clientY, fromIndex) {
      var items = Array.from(linksGrid.querySelectorAll('.link-item:not(.link-add-btn)'));
      var best = fromIndex;
      var bestD = 1e12;
      var found = false;
      for (var i = 0; i < items.length; i++) {
        if (items[i].classList.contains('link-item--placeholder')) continue;
        found = true;
        var r = items[i].getBoundingClientRect();
        var mx = r.left + r.width * 0.5;
        var my = r.top + r.height * 0.5;
        var d = (clientX - mx) * (clientX - mx) + (clientY - my) * (clientY - my);
        if (d < bestD) {
          bestD = d;
          best = i;
        }
      }
      if (!found) return fromIndex;
      var r = items[best].getBoundingClientRect();
      var before = clientX < r.left + r.width * 0.5;
      var insertAt;
      if (before) {
        insertAt = best <= fromIndex ? best : best - 1;
      } else {
        insertAt = best < fromIndex ? best + 1 : best;
      }
      return insertAt;
    }

    function linkSortOnPointerDown(e) {
      if (!mediaPrimaryPointerFine()) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      var item = e.target.closest('.link-item:not(.link-add-btn)');
      if (!item || !linksGrid.contains(item)) return;
      if (e.target.closest('.btn-delete')) return;
      if (e.target.closest('.link-add-btn')) return;
      if (linkSortState) return;
      if (!e.target.closest('.link-card')) return;
      linkSortState = {
        item: item,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        fromIndex: Array.from(linksGrid.querySelectorAll('.link-item:not(.link-add-btn)')).indexOf(item),
        dragging: false,
        ghost: null,
        ox: 0,
        oy: 0
      };
    }

    function linkSortOnPointerMove(e) {
      var st = linkSortState;
      if (!st || e.pointerId !== st.pointerId) return;
      var dx = e.clientX - st.startX;
      var dy = e.clientY - st.startY;
      if (!st.dragging) {
        if (dx * dx + dy * dy < LINK_SORT_THRESHOLD_SQ) return;
        st.dragging = true;
        try {
          st.item.setPointerCapture(e.pointerId);
        } catch (err) {}
        st.item.classList.add('link-item--placeholder');
        linksGrid.classList.add('link-sort-active');
        var rect = st.item.getBoundingClientRect();
        st.ox = st.startX - rect.left;
        st.oy = st.startY - rect.top;
        var ghost = st.item.cloneNode(true);
        ghost.classList.add('link-item--drag-ghost');
        ghost.classList.remove('link-item--placeholder');
        ghost.querySelectorAll('.btn-delete').forEach(function (b) {
          b.remove();
        });
        document.body.appendChild(ghost);
        st.ghost = ghost;
        ghost.style.cssText =
          'position:fixed;z-index:10050;left:' +
          rect.left +
          'px;top:' +
          rect.top +
          'px;width:' +
          rect.width +
          'px;height:' +
          rect.height +
          'px;pointer-events:none;margin:0;box-sizing:border-box;';
        if (e.cancelable) e.preventDefault();
      }
      if (st.ghost) {
        st.ghost.style.left = e.clientX - st.ox + 'px';
        st.ghost.style.top = e.clientY - st.oy + 'px';
      }
      if (st.dragging && e.cancelable) e.preventDefault();
    }

    function linkSortFinishPointer(e, st, doRelease) {
      if (doRelease !== false) {
        try {
          st.item.releasePointerCapture(e.pointerId);
        } catch (err) {}
      }
      linkSortState = null;
      linksGrid.classList.remove('link-sort-active');
      if (st.ghost) {
        st.ghost.remove();
        st.ghost = null;
      }
      if (st.item) st.item.classList.remove('link-item--placeholder');
    }

    function linkSortOnPointerUp(e) {
      var st = linkSortState;
      if (!st || e.pointerId !== st.pointerId) return;
      if (!st.dragging) {
        linkSortState = null;
        return;
      }
      var fromIndex = st.fromIndex;
      var rawInsert = linkSortComputeInsert(e.clientX, e.clientY, fromIndex);
      var links = getLinks().slice();
      var mv = links.splice(fromIndex, 1)[0];
      var insertAt = Math.max(0, Math.min(rawInsert, links.length));
      linkSortFinishPointer(e, st);
      linkSortBlockNextLinkOpen = true;
      if (insertAt === fromIndex) {
        return;
      }
      links.splice(insertAt, 0, mv);
      saveLinks(links);
      renderLinks(true);
    }

    var colorSchemeMq = window.matchMedia('(prefers-color-scheme: dark)');
    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }
    function easeInCubic(t) {
      return t * t * t;
    }
    function runThemeTransition(toNight, persistManualTheme) {
      if (persistManualTheme === undefined) persistManualTheme = true;
      if (document.body.classList.contains('theme-transitioning')) return;
      var DURATION = toNight ? 880 : 1050;
      document.body.classList.add('theme-transitioning', toNight ? 'theme-transitioning-to-night' : 'theme-transitioning-to-light');
      document.body.style.setProperty('--theme-t', toNight ? '0' : '1');
      var start = null;
      function tick(now) {
        if (start == null) start = now;
        var elapsed = now - start;
        var t = Math.min(elapsed / DURATION, 1);
        var eased = toNight ? easeOutCubic(t) : (1 - easeInCubic(t));
        document.body.style.setProperty('--theme-t', String(eased));
        if (elapsed < DURATION) {
          requestAnimationFrame(tick);
        } else {
          document.body.classList.toggle('night-mode', toNight);
          if (persistManualTheme) {
            localStorage.setItem(STORAGE_NIGHT, toNight ? 'on' : 'off');
          }
          document.body.classList.remove('theme-transitioning', 'theme-transitioning-to-night', 'theme-transitioning-to-light');
          document.body.style.removeProperty('--theme-t');
          updateThemeToggleLabels();
          updateFollowSystemMenuCheck();
        }
      }
      requestAnimationFrame(tick);
    }
    function onPrefersColorSchemeChange() {
      if (!isFollowSystem()) return;
      var toNight = colorSchemeMq.matches;
      if (document.body.classList.contains('night-mode') === toNight) return;
      runThemeTransition(toNight, false);
    }
    if (colorSchemeMq.addEventListener) {

      }, 120);
    });
    document.getElementById('settingsFollowSystem').addEventListener('click', function (e) {
      e.stopPropagation();
      if (isFollowSystem()) {
        setFollowSystem(false);
        updateFollowSystemMenuCheck();
        var manualDark = getManualThemeIsDark();
        if (document.body.classList.contains('night-mode') !== manualDark) {
          runThemeTransition(manualDark, false);
        } else {
          updateThemeToggleLabels();
        }
      } else {
        setFollowSystem(true);
        updateFollowSystemMenuCheck();
        var sysDark = systemPrefersDark();
        if (document.body.classList.contains('night-mode') !== sysDark) {
          runThemeTransition(sysDark, false);
        } else {
          updateThemeToggleLabels();
        }
      }
    });
    const searchHintWrap = document.getElementById('searchHintWrap');
    const searchInput = document.getElementById('searchInput');
    const searchInputHint = document.getElementById('searchInputHint');
    searchInput.addEventListener('focus', () => searchHintWrap.classList.add('focused'));
    searchInput.addEventListener('blur', () => searchHintWrap.classList.remove('focused'));
    searchInput.addEventListener('input', () => searchHintWrap.classList.toggle('has-value', searchInput.value.length > 0));
    let currentEngineId = localStorage.getItem(STORAGE_ENGINE_CURRENT) || 'bing';
    const engineBtn = document.getElementById('engineBtn');
    const engineLabel = document.getElementById('engineLabel');
    const engineIcon = document.getElementById('engineIcon');
    const engineIconFallback = document.getElementById('engineIconFallback');
    const engineDropdown = document.getElementById('engineDropdown');
    const searchForm = document.getElementById('searchForm');

    function setEngineById(id) {
      const engines = getEngines();
      const engine = engines.find(e => e.id === id) || engines[0];
      currentEngineId = engine.id;
      localStorage.setItem(STORAGE_ENGINE_CURRENT, currentEngineId);
      engineLabel.textContent = engine.name;
      engineBtn.setAttribute('title', engine.name);
      var faviconUrl = getEngineFaviconUrl(engine);
      if (engineIconFallback) {
        engineIconFallback.textContent = (engine.name && engine.name.charAt(0)) ? engine.name.charAt(0).toUpperCase() : '?';
      }
      if (engineIcon) {
        if (faviconUrl) {
          engineIconFallback.classList.add('show');
          engineIcon.style.display = 'none';
          engineIcon.onerror = function() {
            engineIcon.style.display = 'none';
            if (engineIconFallback) engineIconFallback.classList.add('show');
          };
          engineIcon.onload = function() {
            engineIcon.style.display = 'block';
            if (engineIconFallback) engineIconFallback.classList.remove('show');
          };
          engineIcon.src = faviconUrl;
        } else {
          engineIcon.src = '';
          engineIcon.style.display = 'none';
          if (engineIconFallback) engineIconFallback.classList.add('show');
        }
      }
      document.querySelectorAll('.engine-option').forEach(el => {
        el.classList.toggle('active', el.dataset.engineId === currentEngineId);
      });
      engineDropdown.classList.remove('show');
      engineBtn.setAttribute('aria-expanded', 'false');
    }

    function renderEngineDropdown() {
      const engines = getEngines();
      engineDropdown.innerHTML = engines.map(e =>
        '<div class="engine-option" data-engine-id="' + e.id + '" role="option">' + e.name + '</div>'
      ).join('');
      engineDropdown.querySelectorAll('.engine-option').forEach(opt => {
        opt.addEventListener('click', () => setEngineById(opt.dataset.engineId));
      });
      setEngineById(currentEngineId);
    }

    engineBtn.addEventListener('click', () => {
      const isOpen = engineDropdown.classList.toggle('show');
      engineBtn.setAttribute('aria-expanded', isOpen);
      if (isOpen) {
        const rect = engineBtn.getBoundingClientRect();
        engineDropdown.style.top = (rect.bottom + 6) + 'px';
        engineDropdown.style.left = rect.left + 'px';
      }
    });

    document.addEventListener('click', (e) => {
      if (!engineBtn.contains(e.target) && !engineDropdown.contains(e.target)) {
        engineDropdown.classList.remove('show');
        engineBtn.setAttribute('aria-expanded', 'false');
      }
    });

    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = searchInput.value.trim();
      if (!q) return;
      const engines = getEngines();
      const engine = engines.find(e => e.id === currentEngineId) || engines[0];
      const url = getSearchUrl(engine, q);
      window.location.href = url;
    });

    renderEngineDropdown();
    if (searchInputHint) searchInputHint.textContent = UI.searchHint;
    var engineNameEl = document.getElementById('engineName');
    var engineUrlEl = document.getElementById('engineUrl');
    if (engineNameEl) engineNameEl.placeholder = UI.engineNamePlaceholder;
    if (engineUrlEl) engineUrlEl.placeholder = UI.engineUrlPlaceholder;
    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) {
      requestAnimationFrame(function () {
        searchInput.focus();
      });
    }
    const engineModal = document.getElementById('engineModal');
    const engineListWrap = document.getElementById('engineListWrap');
    const engineNameInput = document.getElementById('engineName');
    const engineUrlInput = document.getElementById('engineUrl');
    const engineEditModal = document.getElementById('engineEditModal');
    const engineEditName = document.getElementById('engineEditName');
    const engineEditUrl = document.getElementById('engineEditUrl');
    let editingEngineIndex = -1;

    function openEngineModal() {
      const engines = getEngines();
      const defaultLabel = UI.engineDefault;
      const setDefaultText = UI.engineSetDefault;
      const editText = UI.engineEdit;
      const deleteText = UI.engineDelete;
      const canDelete = engines.length > 1;

      engineListWrap.innerHTML = engines.map((e, i) => {
        const isDefault = e.id === currentEngineId;
        return '<div class="engine-list-item" data-index="' + i + '">' +
          '<div class="engine-list-item-inner">' +
          '<div class="engine-list-row-content">' + e.name + (isDefault ? ' <small style="opacity:0.8">' + defaultLabel + '</small>' : '') + '</div>' +
          '<div class="engine-list-row-actions">' +
          '<button type="button" class="btn-engine-action primary" data-action="default" data-engine-id="' + e.id + '">' + setDefaultText + '</button>' +
          '<button type="button" class="btn-engine-action" data-action="edit" data-index="' + i + '">' + editText + '</button>' +
          (canDelete ? '<button type="button" class="btn-engine-action danger" data-action="delete" data-index="' + i + '">' + deleteText + '</button>' : '') +
          '</div></div></div>';
      }).join('');

      engineListWrap.querySelectorAll('[data-action="default"]').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); setEngineById(btn.dataset.engineId); openEngineModal(); });
      });
      engineListWrap.querySelectorAll('[data-action="edit"]').forEach(btn => {
        btn.addEventListener('click', (e) => { e.stopPropagation(); openEngineEditModal(parseInt(btn.dataset.index, 10)); });
      });
      engineListWrap.querySelectorAll('[data-action="delete"]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const list = getEngines();
          if (list.length <= 1) return;
          const idx = parseInt(btn.dataset.index, 10);
          const removed = list[idx];
          list.splice(idx, 1);
          saveEngines(list);
          if (currentEngineId === removed.id && list.length) setEngineById(list[0].id);
          renderEngineDropdown();
          openEngineModal();
        });
      });
      engineListWrap.querySelectorAll('.engine-list-item').forEach(row => {
        let startX = 0;
        row.addEventListener('touchstart', function(ev) {
          startX = ev.touches[0].clientX;
        }, { passive: true });
        row.addEventListener('touchend', function(ev) {
          const endX = ev.changedTouches[0].clientX;
          const diff = startX - endX;
          if (Math.abs(diff) > 40) {
            row.classList.toggle('swiped', diff > 0);
          }
        }, { passive: true });
      });

      engineNameInput.value = '';
      engineUrlInput.value = '';
      engineModal.classList.add('show');
    }

    function openEngineEditModal(index) {
      const engines = getEngines();
      const e = engines[index];
      editingEngineIndex = index;
      engineEditName.value = e.name;
      engineEditUrl.value = e.url;
      engineEditModal.classList.add('show');
    }

    document.getElementById('engineModalCancel').addEventListener('click', () => engineModal.classList.remove('show'));
    engineModal.addEventListener('click', (e) => { if (e.target === engineModal) engineModal.classList.remove('show'); });
    document.getElementById('engineModalAdd').addEventListener('click', () => {
      const name = engineNameInput.value.trim();
      const url = engineUrlInput.value.trim();
      if (!url) return;
      const resolved = normalizeEngineInput(url, name || undefined);
      if (!resolved || !resolved.searchUrl) return;
      const engines = getEngines();
      const id = 'custom_' + Date.now();
      engines.push({ id, name: resolved.name, url: resolved.searchUrl, builtin: false });
      saveEngines(engines);
      setEngineById(id);
      renderEngineDropdown();
      openEngineModal();
    });

    document.getElementById('engineEditCancel').addEventListener('click', () => engineEditModal.classList.remove('show'));
    engineEditModal.addEventListener('click', (e) => { if (e.target === engineEditModal) engineEditModal.classList.remove('show'); });
    document.getElementById('engineEditSave').addEventListener('click', () => {
      const name = engineEditName.value.trim();
      const url = engineEditUrl.value.trim();
      if (!name || !url || !url.includes('{q}') || editingEngineIndex < 0) return;
      const engines = getEngines();
      engines[editingEngineIndex] = { ...engines[editingEngineIndex], name, url };
      saveEngines(engines);
      renderEngineDropdown();
      setEngineById(engines[editingEngineIndex].id);
      engineEditModal.classList.remove('show');
      openEngineModal();
    });
  </script>
  <script defer src="https://cn.vercount.one/js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#e8eef6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#2e3038" media="(prefers-color-scheme: dark)" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  <title>新标签页</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.35);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
      --glass-inset: inset 0 1px 0 0 rgba(255, 255, 255, 0.5), inset 0 -1px 0 0 rgba(255, 255, 255, 0.15);
      --radius: 1.25rem;
      --radius-sm: 0.75rem;
      --text: rgba(30, 30, 35, 0.95);
      --text-muted: rgba(60, 60, 70, 0.75);
      --bg-gradient: linear-gradient(165deg, #e8eef6 0%, #dde5f0 35%, #f0f4fb 70%, #e2eaf5 100%);
      --tt-text-light: rgba(30, 30, 35, 0.95);
      --tt-text-dark: rgba(255, 255, 255, 0.92);
      --tt-muted-light: rgba(60, 60, 70, 0.75);
      --tt-muted-dark: rgba(255, 255, 255, 0.65);
      --tt-glass-bg-light: rgba(255, 255, 255, 0.12);
      --tt-glass-bg-dark: rgba(60, 62, 72, 0.35);
      --tt-glass-border-light: rgba(255, 255, 255, 0.35);
      --tt-glass-border-dark: rgba(255, 255, 255, 0.18);
      --tt-search-bg-light: rgba(255, 255, 255, 0.4);
      --tt-search-bg-dark: rgba(255, 255, 255, 0.12);
      --tt-search-border-light: rgba(255, 255, 255, 0.6);
      --tt-search-border-dark: rgba(255, 255, 255, 0.2);
      --tt-search-hover-light: rgba(255, 255, 255, 0.55);
      --tt-search-hover-dark: rgba(255, 255, 255, 0.2);
      --tt-link-bg-light: rgba(255, 255, 255, 0.2);
      --tt-link-bg-dark: rgba(255, 255, 255, 0.1);
      --tt-link-border-light: rgba(255, 255, 255, 0.35);
      --tt-link-border-dark: rgba(255, 255, 255, 0.2);
      --tt-link-hover-light: rgba(255, 255, 255, 0.35);
      --tt-link-hover-dark: rgba(255, 255, 255, 0.18);
      --tt-topbar-bg-light: rgba(255, 255, 255, 0.2);
      --tt-topbar-bg-dark: rgba(255, 255, 255, 0.08);
      --tt-topbar-hover-light: rgba(255, 255, 255, 0.35);
      --tt-topbar-hover-dark: rgba(255, 255, 255, 0.15);
      --tt-glass-after-light: 0.6;
      --tt-glass-after-dark: 0.25;
      --tt-glass-shadow-light: rgba(0, 0, 0, 0.06);
      --tt-glass-shadow-dark: rgba(0, 0, 0, 0.2);
      --tt-footer-muted-light: rgba(30, 30, 38, 0.22);
      --tt-footer-muted-dark: rgba(255, 255, 255, 0.22);
    }
    body.night-mode {
      --glass-bg: rgba(60, 62, 72, 0.35);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      --glass-inset: inset 0 1px 0 0 rgba(255, 255, 255, 0.12);
      --text: rgba(255, 255, 255, 0.92);
      --text-muted: rgba(255, 255, 255, 0.65);
      --bg-gradient: linear-gradient(165deg, #383a42 0%, #3d3f48 35%, #34363e 70%, #2e3038 100%);
    }

    body.night-mode .glass::after {
      opacity: 0.25;
    }

    body.night-mode .search-engine-toggle,
    body.night-mode .search-btn {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    body.night-mode .search-engine-toggle:hover,
    body.night-mode .search-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    body.night-mode .link-card {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    body.night-mode .link-card:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    body.theme-transitioning {
      --text: color-mix(in srgb, var(--tt-text-light) calc((1 - var(--theme-t)) * 100%), var(--tt-text-dark) calc(var(--theme-t) * 100%));
      --text-muted: color-mix(in srgb, var(--tt-muted-light) calc((1 - var(--theme-t)) * 100%), var(--tt-muted-dark) calc(var(--theme-t) * 100%));
      --glass-bg: color-mix(in srgb, var(--tt-glass-bg-light) calc((1 - var(--theme-t)) * 100%), var(--tt-glass-bg-dark) calc(var(--theme-t) * 100%));
      --glass-border: color-mix(in srgb, var(--tt-glass-border-light) calc((1 - var(--theme-t)) * 100%), var(--tt-glass-border-dark) calc(var(--theme-t) * 100%));
      --glass-shadow: 0 8px 32px color-mix(in srgb, var(--tt-glass-shadow-light) calc((1 - var(--theme-t)) * 100%), var(--tt-glass-shadow-dark) calc(var(--theme-t) * 100%));
      --glass-inset: inset 0 1px 0 0 color-mix(in srgb, rgba(255, 255, 255, 0.5) calc((1 - var(--theme-t)) * 100%), rgba(255, 255, 255, 0.12) calc(var(--theme-t) * 100%)), inset 0 -1px 0 0 color-mix(in srgb, rgba(255, 255, 255, 0.15) calc((1 - var(--theme-t)) * 100%), rgba(255, 255, 255, 0.12) calc(var(--theme-t) * 100%));
      --bg-gradient: linear-gradient(165deg,
        color-mix(in srgb, #e8eef6 calc((1 - var(--theme-t)) * 100%), #383a42 calc(var(--theme-t) * 100%)) 0%,
        color-mix(in srgb, #dde5f0 calc((1 - var(--theme-t)) * 100%), #3d3f48 calc(var(--theme-t) * 100%)) 35%,
        color-mix(in srgb, #f0f4fb calc((1 - var(--theme-t)) * 100%), #34363e calc(var(--theme-t) * 100%)) 70%,
        color-mix(in srgb, #e2eaf5 calc((1 - var(--theme-t)) * 100%), #2e3038 calc(var(--theme-t) * 100%)) 100%);
    }
    body.theme-transitioning .glass::after {
      opacity: calc(0.6 - 0.35 * var(--theme-t));
    }
    body.theme-transitioning .search-engine-toggle,
    body.theme-transitioning .search-btn {
      background: color-mix(in srgb, var(--tt-search-bg-light) calc((1 - var(--theme-t)) * 100%), var(--tt-search-bg-dark) calc(var(--theme-t) * 100%));
      border-color: color-mix(in srgb, var(--tt-search-border-light) calc((1 - var(--theme-t)) * 100%), var(--tt-search-border-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .search-engine-toggle:hover,
    body.theme-transitioning .search-btn:hover {
      background: color-mix(in srgb, var(--tt-search-hover-light) calc((1 - var(--theme-t)) * 100%), var(--tt-search-hover-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .link-card {
      background: color-mix(in srgb, var(--tt-link-bg-light) calc((1 - var(--theme-t)) * 100%), var(--tt-link-bg-dark) calc(var(--theme-t) * 100%));
      border-color: color-mix(in srgb, var(--tt-link-border-light) calc((1 - var(--theme-t)) * 100%), var(--tt-link-border-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .link-card:hover {
      background: color-mix(in srgb, var(--tt-link-hover-light) calc((1 - var(--theme-t)) * 100%), var(--tt-link-hover-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .top-bar-btn {
      background: color-mix(in srgb, var(--tt-topbar-bg-light) calc((1 - var(--theme-t)) * 100%), var(--tt-topbar-bg-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .top-bar-btn:hover {
      background: color-mix(in srgb, var(--tt-topbar-hover-light) calc((1 - var(--theme-t)) * 100%), var(--tt-topbar-hover-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .link-add-btn .link-add-inner {
      background: color-mix(in srgb, var(--tt-link-bg-light) calc((1 - var(--theme-t)) * 100%), var(--tt-link-bg-dark) calc(var(--theme-t) * 100%));
      border-color: color-mix(in srgb, var(--tt-link-border-light) calc((1 - var(--theme-t)) * 100%), var(--tt-link-border-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .link-add-btn .link-add-inner:hover {
      background: color-mix(in srgb, var(--tt-link-hover-light) calc((1 - var(--theme-t)) * 100%), var(--tt-link-hover-dark) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .engine-dropdown {
      background: color-mix(in srgb, rgba(255, 255, 255, 0.14) calc((1 - var(--theme-t)) * 100%), rgba(40, 40, 48, 0.9) calc(var(--theme-t) * 100%));
      border-color: color-mix(in srgb, var(--tt-glass-border-light) calc((1 - var(--theme-t)) * 100%), rgba(255, 255, 255, 0.1) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .engine-option:hover {
      background: color-mix(in srgb, rgba(255, 255, 255, 0.35) calc((1 - var(--theme-t)) * 100%), rgba(255, 255, 255, 0.1) calc(var(--theme-t) * 100%));
    }
    body.theme-transitioning .engine-option.active {
      background: color-mix(in srgb, rgba(255, 255, 255, 0.4) calc((1 - var(--theme-t)) * 100%), rgba(255, 255, 255, 0.15) calc(var(--theme-t) * 100%));
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
    }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      min-height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      position: relative;
      background: transparent;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      --page-pad: clamp(0.75rem, 4vw, 2rem);
      padding: var(--page-pad);
      padding-left: max(var(--page-pad), env(safe-area-inset-left, 0px));
      padding-right: max(var(--page-pad), env(safe-area-inset-right, 0px));
      padding-bottom: max(var(--page-pad), env(safe-area-inset-bottom, 0px));
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      z-index: -1;
      inset: 0;
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      background: var(--bg-gradient);
      pointer-events: none;
    }

    @media (pointer: coarse) {
      html,
      body {
        -webkit-user-select: none;
        user-select: none;
        -moz-user-select: none;
        -webkit-touch-callout: none;
      }

      .search-input,
      .modal input:not([type="radio"]):not([type="checkbox"]) {
        -webkit-user-select: text;
        user-select: text;
        -moz-user-select: text;
        -webkit-touch-callout: default;
      }
    }
    .glass {
      position: relative;
      background: var(--glass-bg);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--glass-shadow), var(--glass-inset);
      overflow: hidden;
    }

    .glass::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(165deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.02) 45%, transparent 65%);
      border-radius: var(--radius);
      pointer-events: none;
      opacity: 0.6;
    }
    .main-center {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-top: calc(52px + env(safe-area-inset-top, 0px));
      padding-bottom: max(0.35rem, env(safe-area-inset-bottom, 0px));
    }

    .main-center-stack {
      width: 100%;
      max-width: min(580px, calc(100vw - 2rem));
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
      margin-top: auto;
      margin-bottom: auto;
      padding: 0.25rem 0;
    }

    .search-wrap {
      width: 100%;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .search-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 0.5rem 0.5rem 1.25rem;
      min-height: 56px;
      overflow: visible;
    }

    .search-engine-toggle {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.4rem 0.5rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }

    .search-engine-toggle .engine-toggle-label {
      display: none;
    }

    .search-engine-toggle:hover {
      background: rgba(255, 255, 255, 0.55);
      color: var(--text);
    }

    .search-engine-toggle svg {
      width: 18px;
      height: 18px;
      opacity: 0.9;
    }

    .search-form {
      flex: 1;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: none;
      background: transparent;
      font-size: 1rem;
      color: var(--text);
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.5);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }

    .search-btn:hover {
      background: rgba(255, 255, 255, 0.7);
      transform: scale(1.02);
    }

    .search-btn svg {
      width: 20px;
      height: 20px;
    }
    .search-engine-wrap {
      overflow: visible;
    }

    .engine-dropdown {
      position: fixed;
      min-width: 180px;
      padding: 0.5rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08), inset 0 1px 0 0 rgba(255, 255, 255, 0.4);
      z-index: 1000;
      display: none;
    }

    body.night-mode .engine-dropdown {
      background: rgba(40, 40, 48, 0.9);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .engine-dropdown.show {
      display: block;
    }

    .engine-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 0.75rem;
      margin-bottom: 0.2rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--text);
      transition: background 0.15s, box-shadow 0.15s;
      position: relative;
      isolation: isolate;
    }

    .engine-option-icon-wrap {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .engine-option-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      object-fit: contain;
      display: none;
    }

    .engine-option-icon.show {
      display: block;
    }

    .engine-option-icon-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--text-muted);
      color: #fff;
      font-size: 9px;
      font-weight: 600;
      border-radius: 4px;
    }

    .engine-option-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .engine-option-check {
      flex-shrink: 0;
      font-size: 0.82rem;
      opacity: 0.42;
      visibility: hidden;
      line-height: 1;
    }

    .engine-option.active .engine-option-check {
      visibility: visible;
    }

    .engine-dropdown-divider {
      height: 1px;
      margin: 0.35rem 0.4rem;
      background: color-mix(in srgb, var(--glass-border) 70%, var(--text) 30%);
      opacity: 0.5;
    }

    .engine-dropdown-manage {
      display: flex;
      align-items: center;
      padding: 0.55rem 0.75rem;
      margin-top: 0.1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: background 0.15s, color 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .engine-dropdown-manage:hover {
      background: rgba(255, 255, 255, 0.35);
      color: var(--text);
    }

    body.night-mode .engine-dropdown-manage:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .engine-option:last-child {
      margin-bottom: 0;
    }

    .engine-option:hover {
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    body.night-mode .engine-option:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .engine-option.active {
      background: rgba(255, 255, 255, 0.4);
      font-weight: 500;
    }

    body.night-mode .engine-option.active {
      background: rgba(255, 255, 255, 0.15);
    }
    .quick-links-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: visible;
      flex-shrink: 0;
    }

    .link-add-btn {
      flex-shrink: 0;
    }

    .link-add-btn .link-add-inner {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text);
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
    }

    .link-add-btn .link-add-inner:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.08);
    }

    @keyframes edit-add-fade-soft {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .quick-links-wrap.edit-mode.link-add-enter .link-item:not(.link-add-btn) {
      animation: none;
    }

    .quick-links-wrap.edit-mode.link-add-enter .link-item.link-add-btn {
      animation: edit-add-fade-soft 0.42s ease-out 0.05s both;
    }

    @media (max-width: 560px) {
      .main-center-stack:has(.quick-links-wrap.link-add-enter) .search-wrap {
        animation: none;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .quick-links-wrap.edit-mode.link-add-enter .link-item.link-add-btn {
        animation: none;
      }
    }

    body.night-mode .link-add-btn .link-add-inner {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .link-add-btn .link-add-inner svg {
      width: 24px;
      height: 24px;
    }

    .links-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      position: relative;
      overflow: visible;
    }

    .quick-links-wrap.links-empty .links-grid {
      min-height: 52px;
    }

    .link-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .link-card {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      flex-shrink: 0;
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    .quick-links-wrap.edit-mode .link-card:hover {
      transform: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
    }

    .link-card img.link-favicon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: contain;
    }

    .link-card .link-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.4);
    }

    .link-item .btn-delete {
      position: absolute;
      top: -4px;
      left: -4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;

      { name: 'Brave Search', searchUrl: 'https://search.brave.com/search?q={q}', domains: ['search.brave.com', 'brave.com'], aliases: ['brave', 'bravesearch', 'brave search'] }

    var SITE_NAME_MAP = {
      'github.com': 'GitHub',

    var SEARCH_ENGINE_TEMPLATE_MAP = {};
    (function buildEngineTemplateMap() {
      SEARCH_ENGINE_REGISTRY.forEach(function (entry) {
        entry.domains.forEach(function (d) {
          var key = normalizeHostKey(d);
          if (!key) return;
          var searchUrl = (entry.urlByDomain && entry.urlByDomain[key]) || entry.searchUrl;
          SEARCH_ENGINE_TEMPLATE_MAP[key] = { name: entry.name, searchUrl: searchUrl, faviconDomain: key };
        });
        if (entry.urlByDomain) {
          Object.keys(entry.urlByDomain).forEach(function (d) {
            var key = normalizeHostKey(d);
            if (key && !SEARCH_ENGINE_TEMPLATE_MAP[key]) {
              SEARCH_ENGINE_TEMPLATE_MAP[key] = { name: entry.name, searchUrl: entry.urlByDomain[d], faviconDomain: key };
            }
          });
        }
      });
    })();

    function normalizeFuzzyText(str) {
      return (str || '').toLowerCase().replace(/[\s\-_.·/\\@#]+/g, '').trim();
    }

    function levenshteinDistance(a, b) {
      if (a === b) return 0;
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      var row = [];
      for (var j = 0; j <= b.length; j++) row[j] = j;
      for (var i = 1; i <= a.length; i++) {
        var prev = i;
        for (var k = 1; k <= b.length; k++) {
          var val = a[i - 1] === b[k - 1] ? row[k - 1] : Math.min(row[k - 1], prev, row[k]) + 1;
          row[k - 1] = prev;
          prev = val;
        }
        row[b.length] = prev;
      }
      return row[b.length];
    }

    function hasCJK(str) {
      return /[\u4e00-\u9fff\u3400-\u4dbf\uf900-\ufaff]/.test(str || '');
    }

    function fuzzyMatchEngines(input) {
      var raw = (input || '').trim();
      if (!raw) return [];
      var parsed = parseEngineSiteInput(raw);
      if (parsed && parsed.hostname) {
        var domainTpl = resolveKnownEngineTemplate(parsed);
        if (domainTpl) {
          return [{ name: domainTpl.name, searchUrl: domainTpl.searchUrl, faviconDomain: domainTpl.faviconDomain, score: 100, hint: parsed.hostname }];
        }
      }
      var norm = normalizeFuzzyText(raw);
      if (!norm && !raw) return [];
      var results = [];
      var seen = Object.create(null);
      SEARCH_ENGINE_REGISTRY.forEach(function (entry) {
        var tokens = [entry.name].concat(entry.aliases || []).concat(entry.domains || []);
        var bestScore = 0;
        var bestHint = entry.domains[0] || '';
        if (hasCJK(raw) && entry.name.indexOf(raw) !== -1) {
          bestScore = 88;
        }
        tokens.forEach(function (token) {
          var tn = normalizeFuzzyText(token);
          if (!tn) return;
          var score = 0;
          var rawToken = String(token || '');
          if (tn === norm) score = 98;
          else if (hasCJK(raw) && rawToken.indexOf(raw) !== -1) score = Math.max(score, 86);
          else if (tn.indexOf(norm) !== -1 || norm.indexOf(tn) !== -1) {
            if (hasCJK(norm) && norm.length >= 1) score = Math.max(score, 82);
            else if (norm.length >= 2) score = Math.max(score, 82);
          } else if (norm.length >= 3 && tn.length >= 3) {
            var dist = levenshteinDistance(norm, tn);
            if (dist <= 2) score = Math.max(score, 76 - dist * 7);
          }
          if (score > bestScore) {
            bestScore = score;
            bestHint = entry.domains.indexOf(token) !== -1 ? token : (entry.domains[0] || token);
          }
        });
        if (bestScore >= 68 && !seen[entry.name]) {
          seen[entry.name] = true;
          results.push({ name: entry.name, searchUrl: entry.searchUrl, faviconDomain: entry.domains[0], score: bestScore, hint: bestHint });
        }
      });
      results.sort(function (a, b) { return b.score - a.score; });
      return results;
    }

    function getRegistrableDomain(host) {
      host = normalizeHostKey(host);
      if (!host) return '';
      var parts = host.split('.');
      if (parts.length <= 2) return host;
      return parts.slice(-2).join('.');
    }

    function domainsCompatible(siteHost, resultHost) {
      siteHost = normalizeHostKey(siteHost);
      resultHost = normalizeHostKey(resultHost);
      if (!siteHost || !resultHost) return false;
      if (siteHost === resultHost) return true;
      if (resultHost.endsWith('.' + siteHost) || siteHost.endsWith('.' + resultHost)) return true;
      return false;
    }

    function normalizeHostKey(host) {
      return (host || '').toLowerCase().replace(/^www\./, '').trim();
    }

    function parseEngineSiteInput(input) {
      var raw = (input || '').trim();
      if (!raw) return null;
      var hostname = '';
      var origin = '';
      try {
        var u = new URL(/^https?:\/\//i.test(raw) ? raw : 'https://' + raw.replace(/^\/+/, ''));
        hostname = normalizeHostKey(u.hostname);
        origin = u.origin;
      } catch (e) {
        hostname = normalizeHostKey(raw.replace(/^https?:\/\//, '').replace(/\/.*$/, ''));
        if (!hostname) return null;
        origin = 'https://' + hostname;
      }
      return { hostname: hostname, origin: origin, raw: raw };
    }

    function resolveKnownEngineTemplate(siteInput) {
      var parsed = typeof siteInput === 'string' ? parseEngineSiteInput(siteInput) : siteInput;
      if (!parsed || !parsed.hostname) return null;
      var host = parsed.hostname;
      var tpl = SEARCH_ENGINE_TEMPLATE_MAP[host];
      if (tpl) return { name: tpl.name, searchUrl: tpl.searchUrl, faviconDomain: tpl.faviconDomain || host };
      var parts = host.split('.');
      if (parts.length > 2) {
        var base = parts.slice(-2).join('.');
        tpl = SEARCH_ENGINE_TEMPLATE_MAP[base];
        if (tpl) return { name: tpl.name, searchUrl: tpl.searchUrl, faviconDomain: tpl.faviconDomain || base };
      }
      return null;
    }

    function nameFromDomain(domain) {
      return normalizeHostKey(domain) || '';
    }

    function learnSearchTemplateFromResultUrl(resultUrl, siteHost) {
      var keyword = LEARN_KEYWORD;
      var raw = (resultUrl || '').trim();
      if (!raw) return null;
      if (!/^https?:\/\//i.test(raw)) raw = 'https://' + raw.replace(/^\/+/, '');
      try {
        var u = new URL(raw);
        if (siteHost) {
          if (!domainsCompatible(siteHost, u.hostname)) return { error: 'site_mismatch' };
        }
        var params = new URLSearchParams(u.search);
        var keys = Array.from(params.keys());
        for (var k = 0; k < keys.length; k++) {
          var key = keys[k];
          if (/^(utm_|ref|referer|source|from|campaign)/i.test(key)) continue;
          var val = params.get(key);
          if (!val) continue;
          var decoded = val;
          try { decoded = decodeURIComponent(val.replace(/\+/g, ' ')); } catch (err) {}
          if (val === keyword || decoded === keyword || val === encodeURIComponent(keyword)) {
            params.set(key, '{q}');
            u.search = params.toString();
            return u.href;
          }
        }
        if (u.hash) {
          var hashCandidates = [keyword, encodeURIComponent(keyword), encodeURI(keyword)];
          for (var j = 0; j < hashCandidates.length; j++) {
            var hc = hashCandidates[j];
            if (hc && u.hash.indexOf(hc) !== -1) {
              var hashTpl = u.origin + u.pathname + u.search + u.hash.split(hc).join('{q}');
              if (hashTpl.indexOf('{q}') !== -1) return hashTpl;
            }
          }
        }
        var pathSegments = u.pathname.split('/');
        for (var p = 0; p < pathSegments.length; p++) {
          var seg = pathSegments[p];
          if (seg === keyword || decodeURIComponent(seg) === keyword) {
            pathSegments[p] = '{q}';
            u.pathname = pathSegments.join('/');
            return u.href;
          }
        }
        if (u.pathname.indexOf(keyword) !== -1) {
          var pathTpl = u.origin + u.pathname.split(keyword).join('{q}') + u.search + u.hash;
          if (pathTpl.indexOf('{q}') !== -1) return pathTpl;
        }
        var href = u.href;
        var candidates = [keyword, encodeURIComponent(keyword), encodeURI(keyword)];
        for (var i = 0; i < candidates.length; i++) {
          var c = candidates[i];
          if (c && href.indexOf(c) !== -1) {
            var tpl = href.split(c).join('{q}');
            if (tpl.indexOf('{q}') !== -1) return tpl;
          }
        }
      } catch (e) {}
      return null;
    }

    function engineDomainFromUrl(url) {
      return getEngineDomain(url);
    }

    function engineIdentityKey(searchUrl) {
      var domain = engineDomainFromUrl(searchUrl);
      return domain ? domain + '|' + searchUrl : searchUrl;
    }

    function findDuplicateEngine(engines, searchUrl, excludeIndex) {
      var domain = engineDomainFromUrl(searchUrl);
      if (!domain) return null;
      for (var i = 0; i < engines.length; i++) {
        if (excludeIndex != null && i === excludeIndex) continue;
        if (engineDomainFromUrl(engines[i].url) === domain) return engines[i];
      }
      return null;
    }

    function isDuplicateEngine(engines, searchUrl, excludeIndex) {
      return !!findDuplicateEngine(engines, searchUrl, excludeIndex);
    }

    function getEngines() {
      try {
        const raw = localStorage.getItem(STORAGE_ENGINES);
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr) && arr.length) return arr;
        }

      return DEFAULT_ENGINES.map(e => ({ ...e }));

    function saveEngines(engines) {
      localStorage.setItem(STORAGE_ENGINES, JSON.stringify(engines));

    function getSearchUrl(engine, q) {
      const encoded = encodeURIComponent(q);
      const url = (engine.url || '').trim();
      if (url.includes('baidu.com')) {
        return 'https://www.baidu.com/s?wd=' + encoded;
      }
      return url.replace(/\{q\}/g, encoded);
    }

    function getEngineDomain(url) {
      if (!url || typeof url !== 'string') return '';
      try {
        var u = new URL(url.includes('://') ? url : 'https://' + url);
        return u.hostname.replace(/^www\./, '');
      } catch (e) {
        return '';
      }
    }

    function getFaviconApiUrl(domain) {
      var d = normalizeHostKey(domain);
      if (!d) return '';
      return 'https://api.xinac.net/icon/?url=' + encodeURIComponent('https://' + d);
    }

    function getFaviconIcoUrl(domain) {
      var d = normalizeHostKey(domain);
      if (!d) return '';
      return 'https://' + d + '/favicon.ico';
    }

    function showFaviconFallback(fallbackEl, letter) {
      if (!fallbackEl) return;
      if (letter) fallbackEl.textContent = letter;
      if (fallbackEl.classList.contains('engine-icon-fallback')) {
        fallbackEl.classList.add('show');
      }
      fallbackEl.style.display = 'flex';
    }

    function hideFaviconFallback(fallbackEl) {
      if (!fallbackEl) return;
      if (fallbackEl.classList.contains('engine-icon-fallback')) {
        fallbackEl.classList.remove('show');
      }
      fallbackEl.style.display = 'none';
    }

    function applyFaviconImg(img, domain, fallbackEl, letter) {
      if (!img) return;
      var useClassShow = img.classList.contains('engine-option-icon');
      img.classList.remove('show');
      img.style.display = 'none';
      img.removeAttribute('src');
      img.onerror = null;
      img.onload = null;
      showFaviconFallback(fallbackEl, letter);
      var d = normalizeHostKey(domain);
      if (!d) return;

      var apiUrl = getFaviconApiUrl(d);
      var icoUrl = getFaviconIcoUrl(d);
      var stage = 0;

      function showImg() {
        if (useClassShow) {
          img.classList.add('show');
          img.style.display = 'block';
        } else {
          img.style.display = 'block';
        }
        hideFaviconFallback(fallbackEl);
      }

      function tryLoad(url, onFail) {
        img.onload = function () {
          img.onerror = null;
          showImg();
        };
        img.onerror = function () {
          img.onload = null;
          img.onerror = null;
          img.classList.remove('show');
          img.style.display = 'none';
          img.removeAttribute('src');
          onFail();
        };
        img.src = url;
      }

      function nextStage() {
        stage += 1;
        if (stage === 1) {
          tryLoad(apiUrl, nextStage);
        } else if (stage === 2) {
          tryLoad(icoUrl, function () {
            showFaviconFallback(fallbackEl, letter);
          });
        } else {
          showFaviconFallback(fallbackEl, letter);
        }
      }

      nextStage();
    }

    function getEngineFaviconDomain(engine) {
      if (!engine) return '';
      var fromUrl = getEngineDomain(engine.url);
      if (fromUrl) return fromUrl;
      return '';
    }

    function getEngineFaviconUrl(engine) {
      return getFaviconApiUrl(getEngineFaviconDomain(engine));
    }

    const DEFAULT_LINKS = [];

    const STORAGE_KEY = 'navQuickLinks';

    function normalizeLinkUrl(str) {
      var u = (str || '').trim();
      if (!u) return u;
      if (/^https?:\/\//i.test(u)) return u;
      return 'https://' + u.replace(/^\/+/, '');
    }

    function getDomain(url) {
      try {
        var normalized = normalizeLinkUrl(url);
        if (!normalized) return '';
        const u = new URL(normalized);
        return u.hostname.replace(/^www\./, '');
      } catch {
        return '';
      }
    }

    function normalizeLinkUrlForCompare(str) {
      var n = normalizeLinkUrl(str);
      if (!n) return '';
      try {
        var u = new URL(n);
        var path = u.pathname.replace(/\/+$/, '') || '';
        return u.origin + path + u.search + u.hash;
      } catch (e) {
        return n.toLowerCase();
      }
    }

    function isValidLinkUrl(str) {
      var n = normalizeLinkUrl(str);
      if (!n) return false;
      try {
        var u = new URL(n);
        if (u.protocol !== 'http:' && u.protocol !== 'https:') return false;
        if (!u.hostname || !u.hostname.includes('.')) return false;
        return true;
      } catch (e) {
        return false;
      }
    }

    function autoLinkNameFromUrl(url) {
      var domain = getDomain(url);
      if (!domain) return '';
      if (SITE_NAME_MAP[domain]) return SITE_NAME_MAP[domain];
      var base = getRegistrableDomain(domain);
      if (SITE_NAME_MAP[base]) return SITE_NAME_MAP[base];
      if (domain.split('.').length > 2) {
        return domain;
      }
      var label = domain.split('.')[0] || domain;
      if (label && label !== domain) {
        return label.replace(/-/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); });
      }
      return domain;
    }

    function findDuplicateLink(links, url, excludeIndex) {
      var key = normalizeLinkUrlForCompare(url);
      if (!key) return null;
      for (var i = 0; i < links.length; i++) {
        if (excludeIndex != null && i === excludeIndex) continue;

    function clearToastInlineFontSizes(toastEl) {
      if (!toastEl) return;
      var msg = toastEl.querySelector('.undo-toast-msg');

    function scheduleFitSingleLineToast(toastEl) {
      if (!toastEl) return;
      function runFit() {
        if (!toastEl.classList.contains('show')) return;
        var msgEl = toastEl.querySelector('.undo-toast-msg');
        if (!msgEl) return;
        var btns = toastEl.querySelectorAll('.undo-toast-btn');
        msgEl.style.removeProperty('font-size');
        btns.forEach(function (b) {
          b.style.removeProperty('font-size');
        });
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            var maxRem = 0.875;
            var minRem = 0.45;
            var step = 0.03125;
            var r;
            for (r = maxRem; r >= minRem - 0.0001; r -= step) {
              msgEl.style.fontSize = r + 'rem';
              var bfs = Math.max(minRem, r * 0.92);
              btns.forEach(function (b) {
                b.style.fontSize = bfs + 'rem';
              });
              if (toastEl.scrollWidth <= toastEl.clientWidth + 2 && toastEl.scrollHeight <= toastEl.clientHeight + 2) {
                return;
              }
            }
          });
        });
      }
      runFit();
      setTimeout(runFit, 40);
      setTimeout(runFit, 340);
    }

    var linkSortState = null;
    var linkSortBlockNextLinkOpen = false;

    function abortLinkSortDrag() {
      var st = linkSortState;
      if (!st) return;
      if (st.ghost) {
        st.ghost.remove();
        st.ghost = null;
      }
      if (st.item) {
        st.item.classList.remove('link-item--placeholder');
      }
      linksGrid.classList.remove('link-sort-active');
      linkSortState = null;
    }

    function linkSortComputeInsert(clientX, clientY, fromIndex) {
      var items = Array.from(linksGrid.querySelectorAll('.link-item:not(.link-add-btn)'));
      var best = fromIndex;
      var bestD = 1e12;
      var found = false;
      for (var i = 0; i < items.length; i++) {
        if (items[i].classList.contains('link-item--placeholder')) continue;
        found = true;
        var r = items[i].getBoundingClientRect();
        var mx = r.left + r.width * 0.5;
        var my = r.top + r.height * 0.5;
        var d = (clientX - mx) * (clientX - mx) + (clientY - my) * (clientY - my);
        if (d < bestD) {
          bestD = d;
          best = i;
        }
      }
      if (!found) return fromIndex;
      var r = items[best].getBoundingClientRect();
      var before = clientX < r.left + r.width * 0.5;
      var insertAt;
      if (before) {
        insertAt = best <= fromIndex ? best : best - 1;
      } else {
        insertAt = best < fromIndex ? best + 1 : best;
      }
      return insertAt;
    }

    function linkSortOnPointerDown(e) {
      if (!mediaPrimaryPointerFine()) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      var item = e.target.closest('.link-item:not(.link-add-btn)');
      if (!item || !linksGrid.contains(item)) return;
      if (e.target.closest('.btn-delete')) return;
      if (e.target.closest('.link-add-btn')) return;
      if (linkSortState) return;
      if (!e.target.closest('.link-card')) return;
      linkSortState = {
        item: item,
        pointerId: e.pointerId,
        startX: e.clientX,
        startY: e.clientY,
        fromIndex: Array.from(linksGrid.querySelectorAll('.link-item:not(.link-add-btn)')).indexOf(item),
        dragging: false,
        ghost: null,
        ox: 0,
        oy: 0
      };
    }

    function linkSortOnPointerMove(e) {
      var st = linkSortState;
      if (!st || e.pointerId !== st.pointerId) return;
      var dx = e.clientX - st.startX;
      var dy = e.clientY - st.startY;
      if (!st.dragging) {
        if (dx * dx + dy * dy < LINK_SORT_THRESHOLD_SQ) return;
        st.dragging = true;
        try {
          st.item.setPointerCapture(e.pointerId);
        } catch (err) {}
        st.item.classList.add('link-item--placeholder');
        linksGrid.classList.add('link-sort-active');
        var rect = st.item.getBoundingClientRect();
        st.ox = st.startX - rect.left;
        st.oy = st.startY - rect.top;
        var ghost = st.item.cloneNode(true);
        ghost.classList.add('link-item--drag-ghost');
        ghost.classList.remove('link-item--placeholder');
        ghost.querySelectorAll('.btn-delete').forEach(function (b) {
          b.remove();
        });
        document.body.appendChild(ghost);
        st.ghost = ghost;
        ghost.style.cssText =
          'position:fixed;z-index:10050;left:' +
          rect.left +
          'px;top:' +
          rect.top +
          'px;width:' +
          rect.width +
          'px;height:' +
          rect.height +
          'px;pointer-events:none;margin:0;box-sizing:border-box;';
        if (e.cancelable) e.preventDefault();
      }
      if (st.ghost) {
        st.ghost.style.left = e.clientX - st.ox + 'px';
        st.ghost.style.top = e.clientY - st.oy + 'px';
      }
      if (st.dragging && e.cancelable) e.preventDefault();
    }

    function linkSortFinishPointer(e, st, doRelease) {
      if (doRelease !== false) {
        try {
          st.item.releasePointerCapture(e.pointerId);
        } catch (err) {}
      }
      linkSortState = null;
      linksGrid.classList.remove('link-sort-active');
      if (st.ghost) {
        st.ghost.remove();
        st.ghost = null;
      }
      if (st.item) st.item.classList.remove('link-item--placeholder');
    }

    function linkSortOnPointerUp(e) {
      var st = linkSortState;
      if (!st || e.pointerId !== st.pointerId) return;
      if (!st.dragging) {
        linkSortState = null;
        return;
      }
      var fromIndex = st.fromIndex;
      var rawInsert = linkSortComputeInsert(e.clientX, e.clientY, fromIndex);
      var links = getLinks().slice();
      var mv = links.splice(fromIndex, 1)[0];
      var insertAt = Math.max(0, Math.min(rawInsert, links.length));
      linkSortFinishPointer(e, st);
      linkSortBlockNextLinkOpen = true;
      if (insertAt === fromIndex) {
        return;
      }
      links.splice(insertAt, 0, mv);
      saveLinks(links);
      renderLinks(true);
    }

      if (!isValidLinkUrl(rawUrl)) {

      if (editingIndex >= 0) {

      var btn = document.getElementById('btnNight');

    function runThemeTransition(toNight, persistManualTheme) {
      if (persistManualTheme === undefined) persistManualTheme = true;
      if (document.body.classList.contains('theme-transitioning')) return;
      var DURATION = toNight ? 880 : 1050;
      document.body.classList.add('theme-transitioning', toNight ? 'theme-transitioning-to-night' : 'theme-transitioning-to-light');
      document.body.style.setProperty('--theme-t', toNight ? '0' : '1');
      var start = null;
      function tick(now) {
        if (start == null) start = now;
        var elapsed = now - start;
        var t = Math.min(elapsed / DURATION, 1);
        var eased = toNight ? easeOutCubic(t) : (1 - easeInCubic(t));
        document.body.style.setProperty('--theme-t', String(eased));
        if (elapsed < DURATION) {
          requestAnimationFrame(tick);
        } else {
          document.body.classList.toggle('night-mode', toNight);
          if (persistManualTheme) {
            localStorage.setItem(STORAGE_NIGHT, toNight ? 'on' : 'off');
          }
          document.body.classList.remove('theme-transitioning', 'theme-transitioning-to-night', 'theme-transitioning-to-light');
          document.body.style.removeProperty('--theme-t');

        engineCandidates.classList.remove('show');
        selectedEngineMatch = null;
        return;
      }
      var matches = fuzzyMatchEngines(trimmed);
      var display = matches.filter(function (m) { return m.score >= 68; }).slice(0, 4);
      if (!display.length) {
        engineCandidates.classList.remove('show');
        selectedEngineMatch = null;
        return;
      }
      engineCandidates.classList.add('show');
      if (display.length === 1 && display[0].score >= 90) {
        selectedEngineMatch = display[0];
      } else if (display.length > 1) {
        selectedEngineMatch = null;

      display.forEach(function (m) {
        var item = document.createElement('button');
        item.type = 'button';
        item.className = 'engine-candidate-item';
        var nameSpan = document.createElement('span');
        nameSpan.textContent = m.name;

        hint.textContent = m.hint || '';

    function resolveEngineFromFuzzy(input) {
      var matches = fuzzyMatchEngines(input);
      if (!matches.length) return null;
      if (matches.length === 1 && matches[0].score >= 68) return matches[0];
      if (matches[0].score >= 92 && matches[0].score - (matches[1] ? matches[1].score : 0) >= 10) return matches[0];
      return selectedEngineMatch;
    }

    function resolveEngineConfig(siteUrl, resultUrl, siteHostOverride) {
      var fuzzy = resolveEngineFromFuzzy(siteUrl);
      if (fuzzy) {
        return { name: fuzzy.name, searchUrl: fuzzy.searchUrl };
      }
      var site = parseEngineSiteInput(siteUrl);
      if (!site) return { error: 'invalid' };
      var known = resolveKnownEngineTemplate(site);
      if (known) {
        return { name: known.name, searchUrl: known.searchUrl };
      }
      var siteHost = siteHostOverride || site.hostname;
      if (!resultUrl || !String(resultUrl).trim()) {
        return { needStep2: true, siteHost: siteHost };
      }
      var learned = learnSearchTemplateFromResultUrl(resultUrl, siteHost);
      if (learned && typeof learned === 'object' && learned.error === 'site_mismatch') {
        return { error: 'site_mismatch' };
      }
      if (!learned || String(learned).indexOf('{q}') === -1) {
        return { error: 'unsupported' };
      }
      return { name: nameFromDomain(siteHost), searchUrl: learned };
    }

    });

    document.getElementById('engineEditCancel').addEventListener('click', function () {
      closeOverlayRestoreFocus(engineEditModal);
      resetEngineEditForm();
    });
    engineEditModal.addEventListener('click', function (e) {
      if (e.target === engineEditModal) {
        closeOverlayRestoreFocus(engineEditModal);
        resetEngineEditForm();
      }
    });
    function commitEngineEdit() {
      if (editingEngineIndex < 0) return;
      var siteUrl = engineEditUrl.value.trim();
      if (!siteUrl) {
        showInfoToast('请输入搜索引擎名称或网址');
        return;
      }
      var resultUrl = engineEditInStep2 ? engineEditResultUrlInput.value.trim() : '';
      var resolved = resolveEngineConfig(siteUrl, resultUrl, engineEditSiteHost);
      if (resolved.needStep2) {
        engineEditInStep2 = true;
        engineEditSiteHost = resolved.siteHost || (parseEngineSiteInput(siteUrl) && parseEngineSiteInput(siteUrl).hostname) || '';
        if (engineEditStep2) engineEditStep2.classList.add('show');
        setEngineModalError(engineEditError, '');
        return;
      }
      if (resolved.error === 'site_mismatch') {
        setEngineModalError(engineEditError, 'site_mismatch');
        return;
      }
      if (resolved.error === 'unsupported') {
        setEngineModalError(engineEditError, 'unsupported');
        return;
      }
      if (!resolved.searchUrl) return;
      const engines = getEngines();
      var existingDup = findDuplicateEngine(engines, resolved.searchUrl, editingEngineIndex);
      if (existingDup) {
        closeOverlayRestoreFocus(engineEditModal);
        resetEngineEditForm();
        handleDuplicateEngine(existingDup);
        return;
      }
      var existing = engines[editingEngineIndex];
      engines[editingEngineIndex] = {
        id: existing.id,
        name: resolved.name || existing.name,
        url: resolved.searchUrl,
        builtin: existing.builtin === true
      };
      saveEngines(engines);
      renderEngineDropdown();
      setEngineById(engines[editingEngineIndex].id);
      closeOverlayRestoreFocus(engineEditModal);
      resetEngineEditForm();
      openEngineModal();
    }
    document.getElementById('engineEditSave').addEventListener('click', commitEngineEdit);
    engineEditUrl.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commitEngineEdit(); }
    });
    engineEditResultUrlInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); commitEngineEdit(); }
    });

    function buildExportPayload() {
      return {
        app: 'WeiMinal Navigation',
        version: 1,
        data: {
          links: getLinks(),
          engines: getEngines(),
          currentEngineId: currentEngineId,
          nightMode: localStorage.getItem(STORAGE_NIGHT) === 'on' ? 'on' : 'off',
          followSystem: isFollowSystem() ? '1' : '0'
        }
      };
    }

    function validateImportPayload(obj) {
      if (!obj || typeof obj !== 'object') return null;
      if (obj.app !== 'WeiMinal Navigation') return null;
      if (obj.version !== 1) return null;
      var data = obj.data;
      if (!data || typeof data !== 'object') return null;
      if (!Array.isArray(data.links)) return null;
      if (!Array.isArray(data.engines) || !data.engines.length) return null;
      for (var i = 0; i < data.links.length; i++) {
        var link = data.links[i];
        if (!link || typeof link.name !== 'string' || typeof link.url !== 'string') return null;
      }
      for (var j = 0; j < data.engines.length; j++) {
        var eng = data.engines[j];
        if (!eng || typeof eng.id !== 'string' || typeof eng.name !== 'string' || typeof eng.url !== 'string') return null;
        if (eng.url.indexOf('{q}') === -1) return null;
      }
      if (typeof data.currentEngineId !== 'string') return null;
      if (data.nightMode !== 'on' && data.nightMode !== 'off') return null;
      if (data.followSystem !== '0' && data.followSystem !== '1') return null;
      if (!data.engines.some(function (e) { return e.id === data.currentEngineId; })) return null;
      return data;
    }

    function mergeImportData(backup) {
      var currentLinks = getLinks();
      var currentEngines = getEngines();
      var urlSet = Object.create(null);
      currentLinks.forEach(function (l) { urlSet[normalizeLinkUrlForCompare(l.url)] = true; });
      var mergedLinks = currentLinks.slice();
      backup.links.forEach(function (l) {
        var key = normalizeLinkUrlForCompare(l.url);
        if (!urlSet[key]) {
          urlSet[key] = true;
          mergedLinks.push({ name: l.name, url: l.url });
        }
      });
      var engKeys = Object.create(null);
      var idSet = Object.create(null);
      currentEngines.forEach(function (e) {
        engKeys[engineIdentityKey(e.url)] = true;
        idSet[e.id] = true;
      });
      var mergedEngines = currentEngines.slice();
      backup.engines.forEach(function (e) {
        var key = engineIdentityKey(e.url);
        if (engKeys[key]) return;
        var item = { id: e.id, name: e.name, url: e.url, builtin: e.builtin === true };
        if (idSet[item.id]) {
          item.id = 'custom_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        }
        idSet[item.id] = true;
        engKeys[key] = true;
        mergedEngines.push(item);
      });
      saveLinks(mergedLinks);
      saveEngines(mergedEngines);
      location.reload();
    }

    function applyImportData(data, mode) {
      if (mode === 'merge') {
        mergeImportData(data);
        return;
      }
      saveLinks(data.links);
      saveEngines(data.engines);
      localStorage.setItem(STORAGE_ENGINE_CURRENT, data.currentEngineId);
      localStorage.setItem(STORAGE_NIGHT, data.nightMode);
      localStorage.setItem(STORAGE_FOLLOW_SYSTEM, data.followSystem);
      location.reload();
    }

    function showImportError(msg) {
      if (!importErrorToast) return;
      var msgEl = document.getElementById('importErrorMsg');
      if (msgEl && msg) msgEl.textContent = msg;
      importErrorToast.classList.add('show');
      setTimeout(function () {
        importErrorToast.classList.remove('show');
      }, 3200);
    }

    function hideImportModal() {
      pendingImportData = null;
      if (importModal) importModal.classList.remove('show');
    }

    function updateImportModeUi() {
      var isOverwrite = importModeOverwrite && importModeOverwrite.checked;
      if (importModeMergeLabel) importModeMergeLabel.classList.toggle('selected', !isOverwrite);
      if (importModeOverwriteLabel) importModeOverwriteLabel.classList.toggle('selected', !!isOverwrite);
      if (importOverwriteHint) importOverwriteHint.classList.toggle('show', !!isOverwrite);
    }

    function promptImportConfirm(data) {
      pendingImportData = data;
      if (importStats) {
        importStats.textContent = '快捷链接：' + data.links.length + ' 个\n搜索引擎：' + data.engines.length + ' 个';
      }
      if (importModeMerge) importModeMerge.checked = true;
      updateImportModeUi();
      openOverlayWithFocus(importModal, importModalConfirm);
    }

    function handleImportText(text) {
      var obj;
      try {
        obj = JSON.parse(text);
      } catch (e) {
        showImportError('无法识别此配置文件');
        return;
      }
      var data = validateImportPayload(obj);
      if (!data) {
        showImportError('无法识别此配置文件');
        return;
      }
      promptImportConfirm(data);
    }

    function exportSettings() {
      var payload = buildExportPayload();
      var blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = EXPORT_FILENAME;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 0);
    }

    if (importModeMerge) importModeMerge.addEventListener('change', updateImportModeUi);
    if (importModeOverwrite) importModeOverwrite.addEventListener('change', updateImportModeUi);
    if (importModalCancel) {
      importModalCancel.addEventListener('click', hideImportModal);
    }
    if (importModalConfirm) {
      importModalConfirm.addEventListener('click', function () {
        if (!pendingImportData) return;
        var mode = importModeOverwrite && importModeOverwrite.checked ? 'overwrite' : 'merge';
        var data = pendingImportData;
        hideImportModal();
        applyImportData(data, mode);
      });
    }
    if (importModal) {
      importModal.addEventListener('click', function (e) {
        if (e.target === importModal) hideImportModal();
      });
    }

    if (importSettingsInput) {
      importSettingsInput.addEventListener('change', function () {
        var file = importSettingsInput.files && importSettingsInput.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          handleImportText(reader.result);
        };
        reader.readAsText(file);
        importSettingsInput.value = '';
      });
    }

    document.body.addEventListener('dragover', function (e) {
      if (!e.dataTransfer) return;
      if (Array.from(e.dataTransfer.types || []).indexOf('Files') === -1) return;
      e.preventDefault();
    });
    document.body.addEventListener('drop', function (e) {
      var files = e.dataTransfer && e.dataTransfer.files;
      if (!files || !files.length) return;
      var file = files[0];
      if (!/\.json$/i.test(file.name) && file.type !== 'application/json') return;
      e.preventDefault();
      var reader = new FileReader();
      reader.onload = function () {
        handleImportText(reader.result);
      };
      reader.readAsText(file);
    });

    function dismissSpotlightGuide() {
      if (!spotlightOverlay || !spotlightOverlay.classList.contains('show')) return;
      spotlightOverlay.classList.remove('show');
      spotlightOverlay.setAttribute('aria-hidden', 'true');
      try { localStorage.setItem(STORAGE_SETUP_HINT, '1'); } catch (err) {}
    }

    function initSpotlightGuide() {
      if (!spotlightOverlay) return;
      try {
        if (localStorage.getItem(STORAGE_SETUP_HINT) === '1') return;
      } catch (err) {}
      var isTouchPrimary = false;
      try { isTouchPrimary = window.matchMedia('(pointer: coarse)').matches; } catch (err2) {}
      if (spotlightTitle) {
        spotlightTitle.textContent = isTouchPrimary ? '长按空白处管理页面' : '右键空白处管理页面';
      }
      spotlightOverlay.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(function () {
        spotlightOverlay.classList.add('show');
      });
    }

    if (spotlightDismiss) spotlightDismiss.addEventListener('click', dismissSpotlightGuide);
    if (spotlightBackdrop) spotlightBackdrop.addEventListener('click', dismissSpotlightGuide);

    function handleGlobalEscape() {
      if (spotlightOverlay && spotlightOverlay.classList.contains('show')) {
        dismissSpotlightGuide();
        return true;
      }
      if (engineEditModal && engineEditModal.classList.contains('show')) {
        closeOverlayRestoreFocus(engineEditModal);
        resetEngineEditForm();
        return true;
      }
      if (engineModal && engineModal.classList.contains('show')) {
        closeOverlayRestoreFocus(engineModal);
        resetEngineAddForm();
        return true;
      }
      if (linkModal && linkModal.classList.contains('show')) {
        closeOverlayRestoreFocus(linkModal);
        showModalError(linkModalError, '');
        return true;
      }
      if (importModal && importModal.classList.contains('show')) {
        hideImportModal();
        return true;
      }
      if (resetConfirmToast && resetConfirmToast.classList.contains('show')) {
        hideResetConfirmToast();
        return true;
      }
      if (engineDropdown && engineDropdown.classList.contains('show')) {
        engineDropdown.classList.remove('show');
        engineBtn.setAttribute('aria-expanded', 'false');
        return true;
      }
      if (settingsDropdown && settingsDropdown.classList.contains('show')) {
        settingsDropdown.classList.remove('show');
        return true;
      }
      if (quickLinksWrap && quickLinksWrap.classList.contains('edit-mode')) {
        setEditMode(false);
        return true;
      }
      return false;
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        if (handleGlobalEscape()) e.preventDefault();
        return;
      }
      if (e.key !== 'Enter' || e.shiftKey || e.ctrlKey || e.metaKey || e.altKey) return;
      if (importModal && importModal.classList.contains('show')) {
        e.preventDefault();
        if (importModalConfirm) importModalConfirm.click();
        return;
      }
      if (resetConfirmToast && resetConfirmToast.classList.contains('show')) {
        e.preventDefault();
        if (resetConfirmPrimary) resetConfirmPrimary.click();
      }
    });

    (function initPagePvCounter() {
      var el = document.getElementById('vercount_value_page_pv');
      if (!el) return;
      if (DEBUG_PV) {
        console.log('[WeiMinal PV] element found:', !!el);
        window.addEventListener('load', function () {
          console.log('[WeiMinal PV] vercount script tag:', !!document.querySelector('script[src*="vercount"]'));
          setTimeout(function () {
            console.log('[WeiMinal PV] current value:', el.textContent);
          }, 3000);
        });
      }
      function sanitizePvText() {
        var v = (el.textContent || '').trim();
        if (!v || /^loading$/i.test(v)) {
          el.textContent = '—';
        }
      }
      sanitizePvText();
      try {
        var obs = new MutationObserver(sanitizePvText);
        obs.observe(el, { childList: true, characterData: true, subtree: true });
      } catch (err) {}
      setTimeout(sanitizePvText, 12000);
    })();

    initSpotlightGuide();
  </script>
  <script defer src="https://events.vercount.one/js"></script>
</body>
</html>
